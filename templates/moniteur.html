{% extends "base.html" %}{% block c %}<div class="wrap narrow"><h1>Devenir moniteur</h1>
<p>Moniteur d'auto-école, en CDI ou en indépendant : dites-nous où vous voulez travailler.</p>
<form method="post"><label>Nom<input name="name" required></label><label>E-mail<input type="email" name="email" required></label>
<label>Ville souhaitée<select name="city">{% for v in villes %}<option>{{ v }}</option>{% endfor %}</select></label>
<label>Statut<select name="statut"><option>CDI</option><option>Indépendant</option></select></label>
<button class="btn big">Envoyer ma candidature</button></form></div>{% endblock %}
